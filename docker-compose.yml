# Secrets live in a root-level .env file (gitignored, never committed).
# Copy .env.example to .env and fill in the values before running.
# "${VAR:?msg}" makes compose stop with a clear error if VAR is missing.
services:
  postgres:
    image: postgres:15
    container_name: eventify-postgres
    environment:
      POSTGRES_DB: eventify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Reports "healthy" only once Postgres accepts connections. The backend
    # waits for this, because it runs migrations as soon as it starts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventify"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: eventify-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/eventify?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 14d
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
