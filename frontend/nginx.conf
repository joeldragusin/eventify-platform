server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The app uses client-side routing (BrowserRouter). A refresh on /events/3
  # asks nginx for a file that does not exist, so fall back to index.html and
  # let React Router handle the path.
  location / {
    try_files $uri /index.html;
  }

  # Built asset filenames contain a content hash, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
